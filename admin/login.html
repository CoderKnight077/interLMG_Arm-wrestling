<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login | INTERLMG ARM WRESTLING</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-dark: #0a0a0a;
            --bg-charcoal: #141414;
            --accent-red: #d41e1e;
            --accent-gold: #ffc107;
            --text-white: #ffffff;
            --text-gray: #b0b0b0;
        }
                                                                        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background: var(--bg-dark);
            color: var(--text-white);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-box {
            background: var(--bg-charcoal);
            padding: 3rem;
            width: 100%;
            max-width: 450px;
            border: 1px solid rgba(255,255,255,0.1);
            position: relative;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }

        .login-box::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: linear-gradient(
                90deg,
                var(--accent-red),
                var(--accent-gold),
                var(--accent-red)
            );
        }

        .logo {
            font-family: 'Oswald', sans-serif;
            font-size: 1.6rem;
            text-align: center;
            margin-bottom: 0.5rem;
            letter-spacing: 1px;
        }

        .logo span {
            color: var(--accent-red);
        }

        .login-subtitle {
            text-align: center;
            color: var(--text-gray);
            margin-bottom: 2rem;
            font-size: 0.9rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-gray);
        }

        .form-group input {
            width: 100%;
            padding: 1rem;
            background: var(--bg-dark);
            border: 1px solid rgba(255,255,255,0.1);
            color: white;
            font-size: 1rem;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--accent-red);
        }

        .btn {
            width: 100%;
            padding: 1rem;
            font-family: 'Oswald', sans-serif;
            font-size: 1.1rem;
            text-transform: uppercase;
            border: none;
            cursor: pointer;
            background: var(--accent-red);
            color: white;
            letter-spacing: 1px;
        }

        .btn:hover {
            background: #b51a1a;
        }

        .error {
            color: #ff4444;
            font-size: 0.9rem;
            margin-top: 1rem;
            text-align: center;
            display: none;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 1.5rem;
            color: var(--text-gray);
            text-decoration: none;
            font-size: 0.9rem;
        }

        .back-link:hover {
            color: var(--accent-red);
        }

        @media (max-width: 500px) {
            .login-box {
                padding: 2rem 1.5rem;
            }
        }
    </style>
</head>

<body>

<div class="login-box">

    <h2 class="logo">
        <span>INTERLMG</span> ADMIN
    </h2>

    <p class="login-subtitle">
        Restricted Access - Authorized Personnel Only
    </p>

    <form id="loginForm">

        <div class="form-group">
            <label for="password">Password</label>

            <input
                type="password"
                id="password"
                placeholder="Enter admin password"
                autocomplete="off"
                required
            >
        </div>

        <button type="submit" class="btn">
            LOGIN
        </button>

        <p class="error" id="errorMsg">
            Invalid password
        </p>

    </form>

    <a href="../index.html" class="back-link">
        ← Back to Website
    </a>

</div>

<script>
const ADMIN_PASSWORD = "Pratham@33";

document.getElementById("loginForm").addEventListener("submit", function(e) {

    e.preventDefault();

    const password = document.getElementById("password").value;
    const error = document.getElementById("errorMsg");

    if (password === ADMIN_PASSWORD) {

        // Create admin login session
        sessionStorage.setItem("interlmgadmin", "true");

        // Go to dashboard
        window.location.href = "dashboard.html";

    } else {

        error.style.display = "block";
        error.textContent = "Invalid password";

        document.getElementById("password").value = "";
        document.getElementById("password").focus();
    }
});
</script>

</body>
</html>
